<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SmartBinTag | Notify &amp; Secure Your Bin | SBTAPP</title>

    <!-- Favicon & SBT Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Web App / Add to Home Screen Meta Tags -->
    <meta name="application-name" content="SBTAPP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SBTAPP" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#04352b" />
    <meta name="description" content="SmartBinTag | Notify & Secure Your Bin | SBTAPP - The Digital Registration Plate for Your Wheelie Bin." />

    <!-- Fonts & Leaflet Maps -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body class="bg-[#04352b] text-slate-100 antialiased selection:bg-[#45D153] selection:text-[#04352b]">
    <div id="root"></div>
    <script>
    // Fix Nhost sessionStorage.onChange compatibility
    (function() {
      try {
        if (typeof window !== 'undefined') {
          const storage = window.sessionStorage;
          if (storage && typeof storage.onChange === 'undefined') {
            Object.defineProperty(storage, 'onChange', {
              value: function() {},
              writable: true,
              configurable: true
            });
          }
        }
      } catch(e) {
        // Ignore errors
      }
    })();

    // Register Service Worker for PWA & Background Collection Notifications
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
      });
    }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

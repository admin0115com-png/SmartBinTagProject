<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sbtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a5222" />
      <stop offset="50%" stop-color="#22a833" />
      <stop offset="100%" stop-color="#45D153" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45D153" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5ce06a" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Container for Favicon Visibility on Light/Dark Browsers -->
  <rect width="512" height="512" rx="128" fill="#01140e" />

  <!-- Main SBT Gradient Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sbtGradient)" stroke="url(#borderGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Subtle Accent Highlight -->
  <rect x="40" y="40" width="432" height="216" rx="96" fill="white" fill-opacity="0.08" />

  <!-- SBT Bold White Lettering -->
  <text 
    x="50%" 
    y="50%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="200" 
    letter-spacing="-4"
    style="text-shadow: 0 8px 24px rgba(4, 53, 43, 0.6);"
  >SBT</text>

 
</svg>
